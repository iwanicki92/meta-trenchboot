serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
set debug=slaunch
terminal_output console serial
terminal_input console serial
default=boot
timeout=5

insmod multiboot2
insmod slaunch

# slaunch sets slaunch_psp to 1 on AMD when a PSP with the DRTM service is
# present, else 0. Only the AMDSL build launches through the PSP.
function load_skl {
  if [ "$slaunch_psp" = "1" ]; then
    echo 'Loading SKL (AMDSL) ...'
    slaunch_module /skl-amdsl.bin
  else
    echo 'Loading SKL ...'
    slaunch_module /skl.bin
  fi
}

menuentry 'Boot Linux normally'{
  echo 'Loading Linux ...'
  linux /bzImage rootwait root=LABEL=root rootfstype=ext4 console=ttyS0,115200 earlyprintk=serial,ttyS0,115200
}

menuentry 'Boot Linux with TrenchBoot'{
  echo 'Enabling slaunch ...'
  slaunch
  load_skl
  echo 'Loading Linux ...'
  linux /bzImage rootwait root=LABEL=root rootfstype=ext4 console=ttyS0,115200 earlyprintk=serial,ttyS0,115200
}

# The launch above with one more kernel parameter, so the command line
# measurement in PCR 18 differs while PCR 17 does not. Booted by drtm-tests.
menuentry 'Boot Linux with TrenchBoot (alt)'{
  echo 'Enabling slaunch ...'
  slaunch
  load_skl
  echo 'Loading Linux ...'
  linux /bzImage rootwait root=LABEL=root rootfstype=ext4 console=ttyS0,115200 earlyprintk=serial,ttyS0,115200 drtmtest=alt
}

menuentry 'Boot Xen normally (MB2)' {
  echo 'Loading Xen ...'
  multiboot2 /xen placeholder console=tty0 console=ttyS0,115200 dom0_mem=min:512M dom0_mem=max:4096M ucode=scan smt=off gnttab_max_frames=2048 gnttab_max_maptrack_frames=4096 loglvl=all guest_loglvl=all com1=115200,8n1 console=com1 no-real-mode edd=off
  echo 'Loading Linux ...'
  module2  /bzImage rootwait root=LABEL=root rootfstype=ext4 console=ttyS0,115200 earlyprintk=serial,ttyS0,115200
}

menuentry 'Boot Xen with TrenchBoot (MB2)' {
  echo 'Enabling slaunch ...'
  slaunch
  load_skl
  echo 'Loading Xen ...'
  multiboot2 /xen placeholder console=tty0 console=ttyS0,115200 dom0_mem=min:512M dom0_mem=max:4096M ucode=scan smt=off gnttab_max_frames=2048 gnttab_max_maptrack_frames=4096 loglvl=all guest_loglvl=all com1=115200,8n1 console=com1 no-real-mode edd=off
  echo 'Loading Linux ...'
  module2  /bzImage rootwait root=LABEL=root rootfstype=ext4 console=ttyS0,115200 earlyprintk=serial,ttyS0,115200
}

menuentry 'Boot Xen normally (EFI)' {
  echo 'Loading Xen.efi with xen.cfg configuration...'
  chainloader /xen.efi
}

menuentry 'Boot Xen with TrenchBoot (EFI)' {
  echo 'Enabling slaunch ...'
  slaunch
  load_skl
  echo 'Loading Xen.efi with xen.cfg configuration ...'
  chainloader /xen.efi
}
